# CI Home-GED : build, tests, format, audits de vulnérabilités, build Docker de contrôle.
# Aucune image publiée ici : la publication sur GHCR est dans release.yml (main et tags).
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:
  # Réutilisé par release.yml avant la publication des images.
  workflow_call:
    inputs:
      docker-check:
        description: Construire les images sans les publier
        type: string
        default: "true"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Appelé par release.yml (github.workflow vaut alors « Release ») : ne jamais annuler une publication.
  cancel-in-progress: ${{ github.workflow == 'CI' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  back:
    name: Back (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore HomeGed.slnx
      - run: dotnet build HomeGed.slnx --no-restore --configuration Release
      - name: Format
        run: dotnet format HomeGed.slnx --no-restore --verify-no-changes
      - name: Tests unitaires
        run: dotnet test tests/HomeGed.Api.Tests --no-build --configuration Release

  front:
    name: Front (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/front/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Typage et build
        run: npm run build

  integration:
    name: Intégration (Paperless et PostgreSQL réels)
    runs-on: ubuntu-latest
    # Mêmes versions que deploy/docker-compose.yml : à faire évoluer ensemble.
    services:
      postgres:
        image: docker.io/library/postgres:18-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: homeged
          POSTGRES_USER: homeged
          POSTGRES_PASSWORD: ci-uniquement
        options: >-
          --health-cmd "pg_isready -U homeged -d homeged"
          --health-interval 5s --health-timeout 5s --health-retries 20
      broker:
        image: docker.io/valkey/valkey:9-alpine
      paperless:
        image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1
        ports: ["8000:8000"]
        env:
          PAPERLESS_REDIS: redis://broker:6379
          PAPERLESS_SECRET_KEY: ci-uniquement
          PAPERLESS_URL: http://localhost:8000
          PAPERLESS_BIND_ADDR: 0.0.0.0
          PAPERLESS_ADMIN_USER: ci
          PAPERLESS_ADMIN_PASSWORD: ci-uniquement
        options: >-
          --health-cmd "curl -fs http://localhost:8000/ -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Tests d'intégration
        run: dotnet test tests/HomeGed.IntegrationTests --configuration Release
        env:
          PAPERLESS_URL: http://localhost:8000
          PAPERLESS_USER: ci
          PAPERLESS_PASSWORD: ci-uniquement
          HOMEGED_DB: Host=localhost;Database=homeged;Username=homeged;Password=ci-uniquement

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: dotnet restore HomeGed.slnx
      - name: NuGet (paquets vulnérables, transitifs compris)
        run: |
          dotnet list HomeGed.slnx package --vulnerable --include-transitive | tee nuget-audit.txt
          if grep -q "has the following vulnerable packages" nuget-audit.txt; then
            echo "::error::Paquets NuGet vulnérables détectés"
            exit 1
          fi
      - name: npm (sévérité haute et critique)
        working-directory: src/front
        run: npm audit --audit-level=high

  docker:
    name: Build Docker ${{ matrix.image.name }} (sans publication)
    # Inutile quand release.yml appelle ce workflow : il construit lui-même les images.
    # Chaîne et non booléen : hors workflow_call, inputs.docker-check est vide et null == false en expression.
    if: inputs.docker-check != 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: home-ged, context: ., file: Dockerfile }
          - { name: home-ged-backup, context: deploy/backup, file: deploy/backup/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
